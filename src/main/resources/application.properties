spring.application.name=Backend Clevora
server.port=8080
server.servlet.context-path=/api

spring.config.import=optional:file:.env[.properties]

spring.profiles.active=${APP_ENV:dev}

spring.datasource.url=jdbc:mysql://${MYSQL_DB_IP:localhost}:${MYSQL_DB_PORT:3306}/${MYSQL_DB_NAME:manga_app}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_DB_USERNAME:root}
spring.datasource.password=${MYSQL_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET_KEY:default-secret-key-itguk?ytrjyuedjydkyudfghdstrytdeyudyidbbbbbbbbbbbbbbbbbchange-me}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}